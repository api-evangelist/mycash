name: MyCash
description: MyCash (operated by IN REMIT PTE LTD, Singapore) is a mobile-only cross-border
  remittance service built for migrant workers. Through the MyCash Money mobile app, users
  send money home instantly, reload / top up mobile airtime, and pay bills across supported
  corridors without needing a traditional bank account. The service targets the unbanked and
  underbanked migrant population with low-cost digital money transfer and mobile financial
  services. As of this profile MyCash publishes a consumer mobile application and marketing
  site (inremit.co) but exposes no public developer API, OpenAPI specification, SDKs, or
  developer portal; this API Evangelist profile records the company's public web and security
  posture.
